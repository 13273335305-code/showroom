<!doctype html>
<html lang="zh-CN" class="auth-pending">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    html.auth-pending, html.auth-pending body { background: var(--auth-boot-background) !important; }
    html.auth-pending body > :not(#authOverlay):not(#authBootLoading) { display: none !important; }
    html.auth-pending body::before, html.auth-pending body::after { display: none !important; }
    :root { --auth-boot-background: #eef2f6; }
    /* Session checks use a quiet page cover; Hello belongs to the login intro. */
    .auth-boot-loading { position: fixed; inset: 0; z-index: 1000; background: var(--auth-boot-background); pointer-events: none; }
  </style>
  <title>Spenic · 材质编辑器</title>
  <link rel="icon" type="image/png" sizes="64x64" href="assets/spenic-favicon.png"><link rel="stylesheet" href="workspace.css?v=fabric-default-color-20261015">
<link rel="stylesheet" href="header.css">
  <link rel="stylesheet" href="login.css?v=20261016-uiverse-login-4">
  <link rel="stylesheet" href="header-brand.css">
  <link rel="stylesheet" href="fabric-scan.css">
  <script type="importmap">{"imports":{"three":"./vendor/three/build/three.module.js","three/addons/":"./vendor/three/addons/"}}</script>
  <link rel="stylesheet" href="workspace-developer.css">
  <script type="module" src="shared/workspace-developer.js"></script>
</head>
<body class="standalone material-editor-page">
  <div id="authBootLoading" class="auth-boot-loading" role="status" aria-label="正在验证登录..."></div>
  <header class="topbar">
    <a class="brand" href="./index.html"><img class="brand-logo" src="assets/spenic-logo.png" alt="Spenic"><span class="brand-divider"></span><strong class="brand-title">材质编辑器</strong></a>
    <div class="header-actions">
      <button id="newMaterial">新建材质</button>
      <button id="saveMaterial" class="primary" disabled>保存到资产库</button>
    </div>
  </header>
  <main class="editor-layout">
    <section id="previewPane" class="preview-pane" aria-label="材质预览">
      <canvas id="materialCanvas" aria-label="无限平铺面料预览，左键或中键拖动平移，滚轮缩放，不可旋转"></canvas>
      <div id="patternPreview" class="pattern-preview" hidden></div>
      <span id="materialPreviewZoom" class="fabric-preview-zoom material-preview-zoom" aria-live="polite" hidden></span>
      <div id="materialPreviewMaps" class="material-preview-maps" role="group" aria-label="材质预览图切换" hidden>
        <div class="material-preview-input">
          <button type="button" data-preview-map="input" aria-pressed="false" aria-expanded="false" aria-controls="proceduralCropStart" disabled>BMP Map</button>
          <button id="proceduralCropStart" class="material-preview-crop" type="button" aria-label="裁剪 BMP" title="裁剪 BMP" aria-pressed="false" disabled hidden>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3v13a2 2 0 0 0 2 2h13M3 6h13a2 2 0 0 1 2 2v13"></path></svg>
          </button>
        </div>
        <div class="material-preview-map-group">
          <button type="button" data-preview-map="material" aria-pressed="true">材质效果</button>
          <button type="button" data-preview-map="base" aria-pressed="false" disabled>Base Color</button>
          <button type="button" data-preview-map="height" aria-pressed="false" disabled>Height</button>
          <button type="button" data-preview-map="normal" aria-pressed="false" disabled>Normal</button>
          <button type="button" data-preview-map="roughness" aria-pressed="false" title="粗糙度贴图" disabled>Roughness</button>
          <button type="button" data-preview-map="metalness" aria-pressed="false" title="金属度贴图" disabled>Metalness</button>
          <button type="button" data-preview-map="ao" aria-pressed="false" disabled>AO</button>
        </div>
      </div>
      <div id="materialPreviewModes" class="material-preview-modes" role="group" aria-label="材质预览方式">
        <button type="button" data-preview-mode="flat" aria-label="平铺预览" title="平铺预览" aria-pressed="true">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="7" height="7" rx="1.2"></rect><rect x="13.5" y="3.5" width="7" height="7" rx="1.2"></rect><rect x="3.5" y="13.5" width="7" height="7" rx="1.2"></rect><rect x="13.5" y="13.5" width="7" height="7" rx="1.2"></rect></svg>
        </button>
        <button type="button" data-preview-mode="ball" aria-label="球体预览" title="球体预览" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"></circle><path d="M3.8 9.4h16.4M3.8 14.6h16.4M12 3.5c2.2 2.4 3.2 5.3 3.2 8.5s-1 6.1-3.2 8.5M12 3.5c-2.2 2.4-3.2 5.3-3.2 8.5s1 6.1 3.2 8.5"></path></svg>
        </button>
      </div>
      <div id="proceduralCropViewport" class="procedural-crop-viewport" aria-label="BMP 原图预览" hidden>
        <canvas id="proceduralCropCanvas" width="0" height="0" aria-label="BMP 原图"></canvas>
        <div id="proceduralCropToolbar" class="procedural-crop-toolbar" role="group" aria-label="BMP 裁剪操作" hidden>
          <span id="proceduralCropProgress" role="status">0 / 3</span>
          <button id="proceduralCropReset" type="button">重选</button>
          <button id="proceduralCropCancel" type="button">取消</button>
          <button id="proceduralCropApply" class="primary" type="button" disabled>确认裁剪</button>
        </div>
      </div>
    </section>
    <div class="editor-panel-shell">
      <aside class="editor-panel" aria-label="材质参数">
        <div id="editorMainPage" class="editor-main-page">
        <div class="material-type-tabs" role="group" aria-label="材质大类">
          <button type="button" data-material-type="fabric" aria-pressed="true" class="active">面料</button>
          <button type="button" data-material-type="pattern" aria-pressed="false">图案</button>
        </div>
        <select id="materialType" aria-label="材质大类" hidden><option value="fabric">面料</option><option value="pattern">图案</option></select>
        <div class="material-info-heading editor-section-heading">
          <h2 class="editor-section-title">材质属性</h2>
          <button id="batchFabric" class="editor-secondary-button" type="button" disabled>批处理齐色</button>
        </div>
        <input id="batchFabricFolder" type="file" webkitdirectory multiple accept="image/png,image/jpeg,image/webp,image/bmp" hidden>
        <p id="batchFabricSummary" class="batch-fabric-summary" role="status" hidden></p>
        <label class="material-name-row">名称<input id="name" value="新材质" maxlength="100"></label>
        <label id="fabricCategoryRow">面料分类<select id="category"><option>面布</option><option>边布</option><option>辅料</option><option>其他</option></select></label>
        <label id="fabricColorCodeRow" for="fabricColorCode">面料色号<span class="fabric-color-code-controls"><span id="fabricColorSwatch" class="fabric-color-swatch" role="img" aria-label="色号预览"><span class="fabric-color-swatch-lines" aria-hidden="true"></span></span><input id="fabricColorCode" type="text" maxlength="100" spellcheck="false"></span></label>
        <details id="proceduralWorkspace" class="procedural-material-section" aria-labelledby="proceduralHeading" open>
          <summary class="procedural-material-heading editor-section-heading">
            <svg class="procedural-section-caret" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m4 6 4 4 4-4"></path></svg>
            <h2 id="proceduralHeading" class="editor-section-title">程序化材质</h2>
            <button id="uploadProceduralBmp" class="editor-secondary-button" type="button" aria-label="上传 BMP" disabled><span id="proceduralBmpName">上传 BMP</span></button>
          </summary>
          <input id="proceduralBmpInput" type="file" accept=".bmp,image/bmp,image/x-ms-bmp" aria-label="上传程序化材质 BMP" hidden>
          <div id="proceduralParameters" class="procedural-parameters" hidden>
            <iframe id="proceduralFrame" title="程序化材质参数"></iframe>
          </div>
        </details>
        <div class="pbr-heading-row editor-section-heading">
          <h2 id="pbrHeading" class="editor-section-title">PBR 贴图</h2>
          <button id="openSizingPage" class="editor-secondary-button" type="button" aria-controls="sizingPage" aria-expanded="false">铺贴尺寸</button>
        </div>
        <div id="materialMaps"></div>
        <section id="fabricSheenSection" class="fabric-sheen-section" aria-labelledby="fabricSheenHeading">
          <div class="editor-section-heading">
            <h2 id="fabricSheenHeading" class="editor-section-title">绒毛侧面光</h2>
          </div>
          <div id="fabricSheenControls" class="fabric-sheen-controls"></div>
        </section>
        </div>
      <section id="sizingPage" class="editor-subpage" aria-label="铺贴尺寸" hidden>
        <div class="editor-subpage-header">
          <h2 id="sizingHeading">铺贴尺寸</h2>
          <button id="closeSizingPage" class="editor-close-button" type="button" aria-label="关闭铺贴尺寸">×</button>
        </div>
        <label>铺贴方式<select id="sizing"><option value="physical">真实物理尺寸</option><option value="legacy">原始 UV</option></select></label>
        <div id="physicalControls">
          <label>宽度（cm）<input id="widthCm" type="number" min="0.01" max="100000" step="0.1" value="10"></label>
          <label>高度（cm）<input id="heightCm" type="number" min="0.01" max="100000" step="0.1" value="10"></label>
          <label class="editor-switch-row">等比缩放<input id="lockSizing" type="checkbox" checked></label>
          <label>纹理角度<input id="angle" type="number" min="-180" max="180" value="0"></label>
        </div>
        <div id="repeatControls" hidden>
          <label>重复 U<input id="repeatU" type="number" min="0.01" max="100" step="0.1" value="1"></label>
          <label>重复 V<input id="repeatV" type="number" min="0.01" max="100" step="0.1" value="1"></label>
        </div>
      </section>
      </aside>
      <div id="editorScrollbar" class="editor-scrollbar" aria-hidden="true" hidden><span class="editor-scrollbar-thumb"></span></div>
    </div>
  </main>
  <div id="status" class="status-bar" role="status"></div>
  <dialog id="batchFabricCategoryDialog" class="preview-generation-dialog batch-fabric-category-dialog" aria-labelledby="batchFabricCategoryTitle">
    <form method="dialog">
      <header class="preview-generation-header">
        <h2 id="batchFabricCategoryTitle">批量设置面料分类</h2>
        <button class="editor-close-button" type="submit" value="cancel" aria-label="关闭面料分类选项">×</button>
      </header>
      <div class="batch-fabric-category-body">
        <span class="batch-fabric-default-label" id="batchFabricDefaultLabel">默认色号</span>
        <ul id="batchFabricSwatches" class="batch-fabric-swatches" aria-labelledby="batchFabricDefaultLabel"></ul>
        <label for="batchFabricCategory">面料分类</label>
        <select id="batchFabricCategory" name="category"><option>面布</option><option>边布</option><option>辅料</option><option>其他</option></select>
      </div>
      <footer class="preview-generation-actions">
        <button type="submit" value="cancel">取消</button>
        <button id="confirmBatchFabric" class="primary" type="submit" value="upload">开始上传</button>
      </footer>
    </form>
  </dialog>
  <dialog id="previewGenerationDialog" class="preview-generation-dialog" aria-labelledby="previewGenerationTitle">
    <div class="preview-generation-window">
      <header class="preview-generation-header">
        <div><p class="preview-generation-eyebrow">MATERIAL PREVIEW</p><h2 id="previewGenerationTitle">生成预览图</h2></div>
        <button id="closePreviewGeneration" class="editor-close-button" type="button" aria-label="关闭预览图生成窗口">×</button>
      </header>
      <div class="preview-generation-layout">
        <section class="preview-generation-examples" aria-labelledby="previewExamplesTitle">
          <h3 id="previewExamplesTitle">实际效果预览</h3>
          <div class="preview-example-grid">
            <article class="preview-example-library-card">
              <div class="preview-example-card-art"><img id="previewCardImage" alt="资产库卡片预览"><span id="previewCardEmpty" class="preview-example-empty" hidden>无预览图</span></div>
              <div class="preview-example-card-info"><strong id="previewCardName">新材质</strong><span aria-hidden="true">···</span></div>
            </article>
            <article class="preview-example-ball-card">
              <div class="preview-example-ball"><img id="previewBallImage" alt="设计台材质球预览"><span id="previewBallEmpty" class="preview-example-empty" hidden>无预览图</span></div>
              <strong id="previewBallName">新材质</strong>
            </article>
          </div>
        </section>
        <section class="preview-generation-settings" aria-labelledby="previewSettingsTitle">
          <h3 id="previewSettingsTitle">预览图设置</h3>
          <fieldset>
            <legend>物理尺寸</legend>
            <div class="preview-size-pair">
              <label>宽度（cm）<input id="previewPhysicalWidth" type="number" min="0.01" max="100000" step="0.01"></label>
              <label>高度（cm）<input id="previewPhysicalHeight" type="number" min="0.01" max="100000" step="0.01"></label>
              <button id="previewPhysicalLock" class="preview-ratio-lock" type="button" aria-label="锁定物理尺寸宽高比" aria-pressed="true" title="解锁物理尺寸宽高比"><img src="assets/aspect-ratio-link.svg" alt="" aria-hidden="true"></button>
            </div>
          </fieldset>
          <fieldset>
            <legend>输出像素</legend>
            <div class="preview-size-pair">
              <label>宽度（px）<input id="previewPixelWidth" type="number" min="64" max="2048" step="1" value="400"></label>
              <label>高度（px）<input id="previewPixelHeight" type="number" min="64" max="2048" step="1" value="300"></label>
              <button id="previewPixelLock" class="preview-ratio-lock" type="button" aria-label="锁定输出像素宽高比" aria-pressed="true" title="解锁输出像素宽高比"><img src="assets/aspect-ratio-link.svg" alt="" aria-hidden="true"></button>
            </div>
          </fieldset>
          <p id="previewGenerationHint" class="preview-generation-hint" role="status"></p>
        </section>
      </div>
      <footer class="preview-generation-actions">
        <button id="cancelPreviewGeneration" type="button">取消</button>
        <button id="confirmPreviewGeneration" class="primary" type="button">生成并保存</button>
      </footer>
    </div>
  </dialog>
  <script src="web-demo/bmp-crop.js"></script>
  <script src="web-demo/crop-tool.js"></script>
  <script type="module" src="entries/material-editor.js?v=fabric-default-color-20261015"></script>
</body>
</html>
