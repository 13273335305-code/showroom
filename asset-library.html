<!doctype html>
<html lang="zh-CN" class="auth-pending">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    html.auth-pending, html.auth-pending body { background: var(--auth-boot-background) !important; }
    html.auth-pending body > :not(#authOverlay):not(#authBootLoading) { display: none !important; }
    html.auth-pending body::before, html.auth-pending body::after { display: none !important; }
    :root { --auth-boot-background: #eef2f6; }
    /* Session checks use a quiet page cover; Hello belongs to the login intro. */
    .auth-boot-loading { position: fixed; inset: 0; z-index: 1000; background: var(--auth-boot-background); pointer-events: none; }
  </style>
  <title>Spenic · 资产库</title>
  <link rel="icon" type="image/png" sizes="64x64" href="assets/spenic-favicon.png">
  <link rel="stylesheet" href="workspace.css?v=fabric-instant-delete-20261015"><link rel="stylesheet" href="asset-library.css?v=fabric-instant-delete-20261015"><link rel="stylesheet" href="login.css?v=20261016-uiverse-login-4">
  <link rel="stylesheet" href="header-brand.css">
  <link rel="stylesheet" href="fabric-scan.css">
  <link rel="stylesheet" href="workspace-developer.css">
  <script type="module" src="shared/workspace-developer.js"></script>
</head>
<body class="standalone asset-library-page">
  <div id="authBootLoading" class="auth-boot-loading" role="status" aria-label="正在验证登录..."></div>
  <header class="asset-topbar">
    <a class="asset-brand brand" href="./index.html" aria-label="Spenic 工作空间首页"><img class="brand-logo" src="assets/spenic-logo.png" alt="Spenic"><span class="asset-brand-divider brand-divider"></span><strong class="brand-title">资产库</strong></a>
    <nav class="library-switcher" role="tablist" aria-label="资产库切换">
      <a id="modelTab" href="#assetPanel" role="tab" aria-selected="false" aria-controls="assetPanel" data-library="model" tabindex="-1">模型库</a>
      <a id="fabricTab" href="#assetPanel" role="tab" aria-selected="true" aria-controls="assetPanel" data-library="fabric">面料库</a>
      <a id="patternTab" href="#assetPanel" role="tab" aria-selected="false" aria-controls="assetPanel" data-library="pattern" tabindex="-1">图案库</a>
    </nav>
    <div class="asset-top-actions">
      <form id="assetSearchForm" class="asset-search" role="search">
        <label class="sr-only" for="assetSearch">搜索资产</label>
        <input id="assetSearch" type="search" placeholder="搜索" aria-label="搜索资产">
        <button id="assetSearchSubmit" type="submit" aria-label="开始搜索" title="搜索">
          <svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="13.5" cy="13.5" r="8.5"></circle><path d="M20 20l8 8"></path></svg>
        </button>
      </form>
      <button id="importAssets" class="asset-add-button" type="button" aria-label="增加素材" aria-haspopup="menu" aria-expanded="false" title="增加素材"><span class="asset-add-glyph" aria-hidden="true"></span></button>
      <div id="assetAddMenu" class="asset-add-menu" role="menu" hidden>
        <button id="importAssetsMenu" type="button">导入素材</button>
        <button id="createFolder" type="button">新建文件夹</button>
      </div>
    </div>
  </header>
  <div class="asset-subbar">
      <a id="libraryBack" class="library-back" href="./index.html" aria-label="返回上一级" title="返回上一级"><img src="./assets/library-back.svg" alt="" aria-hidden="true"></a>
    <div id="libraryBreadcrumb" class="library-breadcrumb" aria-label="当前位置"><span class="breadcrumb-link">面料库</span></div>
    <div class="library-sub-actions">
      <select id="assetCategory" aria-label="筛选分类"><option value="all">全部分类</option><option>面布</option><option>边布</option><option>辅料</option><option>其他</option></select>
      <select id="assetSort" aria-label="排序方式"><option value="recent">最近更新</option><option value="oldest">最早更新</option><option value="nameAsc">名称升序</option><option value="nameDesc">名称降序</option></select>
      <button id="moreOptions" class="more-button" type="button" aria-label="更多操作" aria-haspopup="menu" aria-expanded="false" title="更多操作"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="3.8" r="2.05"></circle><circle cx="12" cy="12" r="2.05"></circle><circle cx="12" cy="20.2" r="2.05"></circle></svg></button>
      <div id="moreMenu" class="more-menu" role="menu" hidden><button type="button" id="selectAllAssets" role="menuitem">全选</button><button type="button" id="moveSelectedAssets" role="menuitem">移动</button><button type="button" id="deleteSelectedAssets" role="menuitem">删除</button></div>
    </div>
  </div>
  <main class="library-main">
    <input id="assetFiles" type="file" accept=".fbx,.glb,.bin,.ktx2,.png,.jpg,.jpeg,.webp,.bmp,.formmat" multiple hidden>
    <section id="assetPanel" class="is-asset-loading" aria-label="面料资产" aria-busy="true">
      <div id="assetLoading" class="asset-loading-indicator" role="status" aria-label="正在加载资产"><div class="asset-grid-loader" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div></div>
      <section id="assetGrid" class="asset-grid asset-loading-content" aria-label="资产列表" inert></section>
    </section>
  </main>
  <div id="assetScrollbar" class="asset-scrollbar" aria-hidden="true"><span class="asset-scrollbar-thumb"></span></div>
  <dialog id="assetDialog" class="asset-dialog" aria-labelledby="assetDialogTitle">
    <form id="assetEditForm">
      <h2 id="assetDialogTitle"></h2><label id="assetTextLabel" for="assetText">名称</label><textarea id="assetText" rows="3"></textarea>
      <div id="materialEditFields" hidden>
        <label for="materialEditName">名称</label><input id="materialEditName" type="text" maxlength="120">
        <label for="materialEditCategory">分类</label><select id="materialEditCategory"><option value="面布">面布</option><option value="边布">边布</option><option value="辅料">辅料</option><option value="其他">其他</option></select>
        <label for="materialEditDesignInfo">设计信息</label><textarea id="materialEditDesignInfo" rows="4" maxlength="1000"></textarea>
        <label for="materialEditSupplier">供应商</label><input id="materialEditSupplier" type="text" maxlength="200">
      </div>
      <div id="assetPreviewEditor" hidden><img id="assetPreviewImage" alt="当前预览图"><label for="assetPreviewFile">选择预览图</label><input id="assetPreviewFile" type="file" accept="image/png,image/jpeg,image/webp,image/bmp"><p>支持 PNG、JPG、WebP、BMP，最大 16 MB。</p></div>
      <p id="assetEditError" role="alert"></p><div class="asset-dialog-actions"><button id="cancelAssetEdit" type="button">取消</button><button id="saveAssetEdit" class="primary" type="submit">保存</button></div>
    </form>
  </dialog>
  <dialog id="moveDialog" class="asset-dialog folder-dialog" aria-labelledby="moveDialogTitle">
    <form id="moveAssetForm">
      <h2 id="moveDialogTitle">移动资产</h2>
      <label for="moveAssetTarget">目标文件夹</label>
      <select id="moveAssetTarget"></select>
      <p id="moveAssetError" role="alert"></p>
      <div class="asset-dialog-actions"><button id="cancelMove" type="button">取消</button><button id="saveMove" class="primary" type="submit">移动</button></div>
    </form>
  </dialog>
  <dialog id="newFolderDialog" class="asset-dialog folder-dialog" aria-labelledby="newFolderDialogTitle">
    <form id="newFolderForm">
      <h2 id="newFolderDialogTitle">新建文件夹</h2>
      <label for="newFolderName">文件夹名称</label>
      <input id="newFolderName" type="text" maxlength="120" autocomplete="off">
      <p id="newFolderError" role="alert"></p>
      <div class="asset-dialog-actions"><button id="cancelNewFolder" type="button">取消</button><button class="primary" type="submit">创建</button></div>
    </form>
  </dialog>
  <dialog id="deleteDialog" class="asset-dialog folder-dialog delete-dialog" aria-labelledby="deleteDialogTitle">
    <form id="deleteAssetForm">
      <h2 id="deleteDialogTitle">删除资产</h2>
      <p id="deleteDialogMessage"></p>
      <div class="asset-dialog-actions"><button id="cancelDelete" type="button">取消</button><button id="confirmDelete" class="primary" type="submit">删除</button></div>
    </form>
  </dialog>
  <dialog id="fabricPreviewDialog" class="fabric-preview-dialog" aria-labelledby="fabricPreviewTitle">
    <div class="fabric-preview-window">
      <div class="fabric-preview-heading">
        <div>
          <p class="fabric-preview-eyebrow">面料预览</p>
          <h2 id="fabricPreviewTitle">面料详情</h2>
        </div>
        <button id="closeFabricPreview" class="fabric-preview-close" type="button" aria-label="关闭面料预览">×</button>
      </div>
      <section id="fabricPreviewSurface" class="fabric-preview-texture" aria-label="面料纹理图" aria-busy="false">
        <canvas id="fabricPreviewTexture" width="1200" height="900" aria-label="面料纹理图"></canvas>
        <div id="fabricPreviewTextureFallback" class="fabric-preview-texture-fallback" hidden>
          <div class="fabric-preview-loading-background" aria-hidden="true"><img id="fabricPreviewLoadingImage" alt="" hidden></div>
          <div id="fabricPreviewLoader" class="flip-card" role="status" aria-label="Loading texture" hidden>
            <div class="flip-card__box" aria-hidden="true"><div class="flip-card__face flip-card__face--front"></div><div class="flip-card__face flip-card__face--back"></div></div>
          </div>
        </div>
        <div id="fabricPreviewZoomControl" class="fabric-preview-zoom-control" hidden aria-label="纹理缩放">
          <button id="fabricPreviewZoomIn" type="button" aria-label="放大纹理" title="放大">＋</button>
          <div id="fabricPreviewZoomRange" class="fabric-preview-zoom-slider" role="slider" tabindex="0" aria-label="纹理缩放比例" aria-orientation="vertical" aria-valuemin="0" aria-valuemax="1" aria-valuenow="0">
            <span class="fabric-preview-zoom-thumb" aria-hidden="true"></span>
          </div>
          <button id="fabricPreviewZoomOut" type="button" aria-label="缩小纹理" title="缩小">－</button>
        </div>
        <span id="fabricPreviewZoom" class="fabric-preview-zoom" aria-live="polite" hidden></span>
        <div id="fabricPreviewError" class="fabric-preview-error" role="status" hidden>
          <span id="fabricPreviewErrorMessage"></span>
          <button id="retryFabricPreview" type="button">重新加载</button>
        </div>
      </section>
      <section class="fabric-preview-details" aria-labelledby="fabricPreviewDetailsTitle">
        <div class="fabric-preview-details-heading">
          <h3 id="fabricPreviewDetailsTitle">面料信息</h3>
          <span id="fabricPreviewCategory"></span>
        </div>
        <div class="fabric-preview-details-body">
          <div id="fabricPreviewFields" class="fabric-preview-fields"></div>
          <div id="fabricPreviewIdentity" hidden aria-label="面料二维码标签"></div>
        </div>
      </section>
    </div>
  </dialog>
  <div id="status" class="status-bar" role="status"></div>
  <div class="asset-library-footer">
    <nav id="assetPagination" class="asset-pagination" aria-label="资产库翻页" hidden></nav>
    <div class="upload-tasks-control">
      <button id="uploadTasksButton" class="upload-tasks-button" type="button" title="上传任务" aria-label="上传任务" aria-expanded="false" aria-controls="uploadTasksPanel"><img src="assets/upload-task.svg" alt="" aria-hidden="true"><span id="uploadTasksBadge" class="upload-tasks-badge" hidden></span></button>
      <section id="uploadTasksPanel" class="upload-tasks-panel" aria-labelledby="uploadTasksTitle" hidden>
        <header><h2 id="uploadTasksTitle">上传任务</h2><button type="button" class="upload-tasks-close" data-close-uploads aria-label="关闭上传任务" title="关闭">×</button></header>
        <ul id="uploadTasksList" class="upload-tasks-list" aria-live="polite"></ul>
        <footer><button id="clearCompletedUploads" type="button" hidden>清除已完成</button></footer>
      </section>
    </div>
  </div>
  <script type="importmap">{"imports":{"three":"./vendor/three/build/three.module.js","three/addons/":"./vendor/three/addons/"}}</script>
  <script type="module" src="entries/asset-library.js?v=20261019-batch-actions"></script>
</body>
</html>
