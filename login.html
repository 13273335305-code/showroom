<!doctype html>
<html lang="zh-CN" class="auth-login-document">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#080a11">
  <title>Spenic · 登录</title>
  <style>
    html.auth-login-document, html.auth-login-document body { margin: 0; min-height: 100%; background: #000; }
    /* Keep the first loading frame independent of module downloads. */
    .auth-boot-loading { position: fixed; inset: 0; z-index: 1000; display: grid; place-items: center; background: #000; pointer-events: none; transition: opacity 200ms cubic-bezier(.23, 1, .32, 1); }
    .auth-boot-loading[data-ready] { opacity: 0; }
    /* The same plain greeting renders before any external downloads. */
    .auth-intro-hello {
      position: fixed; top: 50%; left: 50%; z-index: 11; display: grid; place-items: center;
      color: #c6c6ce; background: none; transform: translate(-50%, -50%);
      font: 500 clamp(30px, 4vw, 58px)/1.2 -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Segoe UI", sans-serif;
      letter-spacing: .08em;
      pointer-events: none; user-select: none;
    }
    .auth-intro-hello::after {
      content: 'Hello'; position: absolute; inset: 0; color: #fff;
      clip-path: polygon(-60% 0, -30% 0, -60% 100%, -90% 100%);
      animation: auth-hello-sweep 1800ms linear infinite;
    }
    @keyframes auth-hello-sweep {
      0% { clip-path: polygon(-60% 0, -30% 0, -60% 100%, -90% 100%); }
      75%, 100% { clip-path: polygon(190% 0, 220% 0, 190% 100%, 160% 100%); }
    }
    @media (prefers-reduced-motion: reduce) { .auth-intro-hello::after { animation: none; } }
    @media (forced-colors: active) { .auth-boot-loading { background: Canvas; } .auth-intro-hello { color: CanvasText; } .auth-intro-hello::after { display: none; } }
  </style>
  <link rel="icon" type="image/png" sizes="64x64" href="assets/spenic-favicon.png">
  <link rel="stylesheet" href="login.css">
</head>
<body class="auth-login-page">
  <div id="authBootLoading" class="auth-boot-loading" role="status" aria-label="正在载入...">
    <span class="auth-intro-hello" aria-hidden="true">Hello</span>
  </div>
  <script type="module" src="shared/auth.js"></script>
</body>
</html>
