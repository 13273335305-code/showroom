<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Spenic · 资产库</title>
  <link rel="icon" type="image/png" sizes="64x64" href="assets/spenic-favicon.png">
  <link rel="stylesheet" href="workspace.css"><link rel="stylesheet" href="header.css"><link rel="stylesheet" href="asset-library.css">
</head>
<body class="standalone asset-library-page">
  <header class="topbar asset-topbar">
    <a class="brand" href="./index.html" aria-label="Spenic 工作空间首页"><img src="assets/spenic-logo.png" alt="Spenic"><span class="brand-divider"></span><strong>资产库</strong></a>
    <nav class="library-switcher" role="tablist" aria-label="资产库切换">
      <button id="modelTab" role="tab" aria-selected="false" aria-controls="assetPanel" data-library="model" tabindex="-1">模型库</button>
      <button id="fabricTab" role="tab" aria-selected="true" aria-controls="assetPanel" data-library="fabric">面料库</button>
      <button id="patternTab" role="tab" aria-selected="false" aria-controls="assetPanel" data-library="pattern" tabindex="-1">图案库</button>
    </nav>
    <div class="asset-top-actions">
      <label class="asset-search"><span class="sr-only">搜索资产</span><input id="assetSearch" type="search" placeholder="搜索" aria-label="搜索资产"><span aria-hidden="true">⌕</span></label>
      <button id="newFolder" class="top-icon-button" type="button" aria-label="新建文件夹" title="新建文件夹"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 7.5h6l2 2h9v8.5a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2v-10.5Z"/><path d="M3.5 7.5v-1a2 2 0 0 1 2-2h4l2 2h4"/></svg></button>
      <button id="importAssets" class="top-icon-button add-button" type="button" aria-label="增加素材" title="增加素材">＋</button>
    </div>
  </header>

  <main class="library-main">
    <div class="library-subbar">
      <a class="library-back" href="./index.html" aria-label="返回工作空间">‹</a>
      <div class="library-breadcrumb" aria-label="当前位置"><span>资产库</span><b>›</b><strong id="libraryBreadcrumb">面料库</strong></div>
      <div class="library-sub-actions">
        <select id="assetCategory" aria-label="筛选分类"><option value="all">全部</option><option>面布</option><option>边布</option><option>包边条</option><option>其他</option></select>
        <select id="assetSort" aria-label="排序方式"><option value="recent">最近更新</option><option value="name">名称</option></select>
        <button id="moreOptions" class="more-button" type="button" aria-label="更多选项" aria-expanded="false">☰</button>
        <div id="moreMenu" class="more-menu" hidden><button type="button" id="refreshAssets">刷新资产</button><button type="button" id="clearSearch">清除搜索</button></div>
      </div>
    </div>

    <input id="assetFiles" type="file" accept=".fbx,.png,.jpg,.jpeg,.webp,.bmp,.formmat" multiple hidden>
    <section id="assetPanel" role="tabpanel" aria-labelledby="fabricTab">
      <p id="assetCount" role="status"></p>
      <section id="assetGrid" class="asset-grid" aria-label="资产列表"></section>
    </section>
    <p class="library-note">支持 FBX、图片和 .formmat 材质包；资产保存在当前浏览器中。</p>
  </main>
  <dialog id="assetDialog" class="asset-dialog" aria-labelledby="assetDialogTitle">
    <form id="assetEditForm">
      <h2 id="assetDialogTitle"></h2><label id="assetTextLabel" for="assetText">名称</label><textarea id="assetText" rows="3"></textarea>
      <div id="assetPreviewEditor" hidden><img id="assetPreviewImage" alt="当前预览图"><label for="assetPreviewFile">选择预览图</label><input id="assetPreviewFile" type="file" accept="image/png,image/jpeg,image/webp,image/bmp"><p>支持 PNG、JPG、WebP、BMP，最大 16 MB。</p></div>
      <p id="assetEditError" role="alert"></p><div class="asset-dialog-actions"><button id="cancelAssetEdit" type="button">取消</button><button id="saveAssetEdit" class="primary" type="submit">保存</button></div>
    </form>
  </dialog>
  <div id="status" class="status-bar" role="status"></div>
  <script type="importmap">{"imports":{"three":"./vendor/three/build/three.module.js","three/addons/":"./vendor/three/addons/"}}</script>
  <script type="module" src="entries/asset-library.js"></script>
</body>
</html>
