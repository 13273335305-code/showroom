<!doctype html>
<html lang="zh-CN" class="auth-login-document">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#080a11">
  <title>Spenic · 登录</title>
  <style>
    html.auth-login-document, html.auth-login-document body { margin: 0; min-height: 100%; background: #000; }
    /* Keep the first loading frame independent of module downloads. */
    .auth-boot-loading { position: fixed; inset: 0; z-index: 1000; display: grid; place-items: center; background: #000; pointer-events: none; transition: opacity 200ms cubic-bezier(.23, 1, .32, 1); }
    .auth-boot-loading[data-ready] { opacity: 0; }
    /* The same plain greeting renders before any external downloads. */
    .auth-intro-hello {
      position: fixed; top: 50%; left: 50%; z-index: 11; display: block;
      color: #e5e5e5; background: none; transform: translate(-50%, -50%);
      font: 500 clamp(30px, 4vw, 58px)/1.2 -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Segoe UI", sans-serif;
      letter-spacing: .08em;
      pointer-events: none; user-select: none;
    }
    .auth-intro-hello > span { display: inline-block; opacity: .45; animation: auth-hello-thinking 1.8s linear infinite; }
    .auth-intro-hello > span:nth-child(2) { animation-delay: -1.68s; }
    .auth-intro-hello > span:nth-child(3) { animation-delay: -1.56s; }
    .auth-intro-hello > span:nth-child(4) { animation-delay: -1.44s; }
    .auth-intro-hello > span:nth-child(5) { animation-delay: -1.32s; }
    @keyframes auth-hello-thinking {
      0%, 30%, 100% { opacity: .45; }
      55% { opacity: 1; }
      80% { opacity: .45; }
    }
    @media (prefers-reduced-motion: reduce) { .auth-intro-hello > span { animation: none; opacity: .8; } }
    @media (forced-colors: active) { .auth-boot-loading { background: Canvas; } .auth-intro-hello { color: CanvasText; } .auth-intro-hello > span { animation: none; opacity: 1; } }
  </style>
  <link rel="icon" type="image/png" sizes="64x64" href="assets/spenic-favicon.png">
  <link rel="stylesheet" href="login.css">
</head>
<body class="auth-login-page">
  <div id="authBootLoading" class="auth-boot-loading" role="status" aria-label="正在载入...">
    <span class="auth-intro-hello" aria-hidden="true"><span>H</span><span>e</span><span>l</span><span>l</span><span>o</span></span>
  </div>
  <script type="module" src="shared/auth.js"></script>
</body>
</html>
