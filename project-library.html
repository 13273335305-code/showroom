<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Spenic · 项目库</title>
  <link rel="icon" type="image/png" sizes="64x64" href="assets/spenic-favicon.png">
  <link rel="stylesheet" href="workspace.css"><link rel="stylesheet" href="asset-library.css"><link rel="stylesheet" href="project-library.css"><link rel="stylesheet" href="login.css">
</head>
<body class="standalone asset-library-page project-library-page">
  <header class="asset-topbar">
    <a class="asset-brand" href="./index.html" aria-label="Spenic 工作空间首页"><img src="assets/spenic-logo.png" alt="Spenic"><span class="asset-brand-divider"></span><strong>项目库</strong></a>
    <nav class="library-switcher project-view-switcher" aria-label="项目范围">
      <a href="?view=personal" data-project-view="personal" aria-selected="true">个人</a>
      <a href="?view=public" data-project-view="public" aria-selected="false">公开</a>
    </nav>
    <div class="asset-top-actions">
      <form id="projectSearchForm" class="asset-search" role="search">
        <label class="sr-only" for="projectSearch">搜索项目</label>
        <input id="projectSearch" type="search" placeholder="搜索" aria-label="搜索项目">
        <button type="submit" aria-label="开始搜索" title="搜索"><svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="13.5" cy="13.5" r="8.5"></circle><path d="M20 20l8 8"></path></svg></button>
      </form>
      <button id="importProject" class="asset-add-button" type="button" aria-label="增加项目" aria-haspopup="menu" aria-expanded="false" title="增加项目"><span class="asset-add-glyph" aria-hidden="true"></span></button>
      <div id="projectAddMenu" class="asset-add-menu" role="menu" hidden>
        <button id="importProjectMenu" type="button">导入项目</button>
        <button id="createProjectFolder" type="button">新建文件夹</button>
      </div>
      <input id="projectFiles" type="file" accept=".form,.zip" multiple hidden>
    </div>
  </header>
  <div class="asset-subbar project-subbar">
    <a id="projectLibraryBack" class="library-back" href="./index.html" aria-label="返回工作空间" title="返回工作空间"><img src="./assets/library-back.svg" alt="" aria-hidden="true"></a>
    <div id="projectBreadcrumb" class="library-breadcrumb" aria-label="当前位置"><button class="breadcrumb-link" aria-current="page" type="button">项目库</button></div>
    <div class="library-sub-actions"><select id="projectSort" aria-label="排序方式"><option value="recent">最近更新</option><option value="oldest">最早更新</option><option value="nameAsc">名称升序</option><option value="nameDesc">名称降序</option></select><button id="projectMoreOptions" class="more-button" type="button" aria-label="更多操作" aria-haspopup="menu" aria-expanded="false" title="更多操作"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="3.8" r="2.05"></circle><circle cx="12" cy="12" r="2.05"></circle><circle cx="12" cy="20.2" r="2.05"></circle></svg></button><div id="projectMoreMenu" class="more-menu" role="menu" hidden><button type="button" id="selectAllProjects" role="menuitem">全选</button><button type="button" id="refreshProjects" role="menuitem">刷新项目</button><button type="button" id="clearProjectSearch" role="menuitem">清除搜索</button></div></div>
  </div>
  <main class="library-main project-main">
    <section id="projectPanel" aria-label="项目列表">
      <div id="projectEmpty" class="project-empty" hidden><strong>暂无保存的项目</strong><span>在设计台点击保存，即可在这里继续工作。</span></div>
      <section id="projectGrid" class="asset-grid" aria-label="项目列表"></section>
    </section>
  </main>
  <div id="assetScrollbar" class="asset-scrollbar" aria-hidden="true"><span class="asset-scrollbar-thumb"></span></div>
  <dialog id="renameProjectDialog" class="asset-dialog folder-dialog" aria-labelledby="renameProjectTitle">
    <form id="renameProjectForm"><h2 id="renameProjectTitle">重命名项目</h2><label for="renameProjectName">项目名称</label><input id="renameProjectName" type="text" maxlength="120" autocomplete="off"><p id="renameProjectError" role="alert"></p><div class="asset-dialog-actions"><button id="cancelRenameProject" type="button">取消</button><button class="primary" type="submit">保存</button></div></form>
  </dialog>
  <dialog id="projectMoveDialog" class="asset-dialog folder-dialog" aria-labelledby="projectMoveTitle">
    <form id="projectMoveForm"><h2 id="projectMoveTitle">移动项目</h2><label for="projectMoveTarget">目标文件夹</label><select id="projectMoveTarget"></select><p id="projectMoveError" role="alert"></p><div class="asset-dialog-actions"><button id="cancelProjectMove" type="button">取消</button><button class="primary" type="submit">移动</button></div></form>
  </dialog>
  <dialog id="newProjectFolderDialog" class="asset-dialog folder-dialog" aria-labelledby="newProjectFolderTitle">
    <form id="newProjectFolderForm"><h2 id="newProjectFolderTitle">新建文件夹</h2><label for="newProjectFolderName">文件夹名称</label><input id="newProjectFolderName" type="text" maxlength="120" autocomplete="off"><p id="newProjectFolderError" role="alert"></p><div class="asset-dialog-actions"><button id="cancelNewProjectFolder" type="button">取消</button><button class="primary" type="submit">创建</button></div></form>
  </dialog>
  <div id="status" class="status-bar" role="status"></div>
  <script type="module" src="entries/project-library.js"></script>
</body>
</html>
